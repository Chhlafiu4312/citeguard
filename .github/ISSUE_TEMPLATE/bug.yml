name: Bug report
description: Report a reproducible CiteGuard defect without including private manuscripts or live internal targets.
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not paste private manuscripts, credentials, or real internal-network targets. Use synthetic examples.
  - type: input
    id: version
    attributes:
      label: CiteGuard version
      placeholder: 0.1.2
    validations:
      required: true
  - type: input
    id: harness
    attributes:
      label: DeepSeek Harness version and profile
      placeholder: '@deepseek-ai/dsh version, web or headless'
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include exact commands and documentation-only identifiers or hosts.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected evidence status
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual evidence status and safe logs
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I replaced all private data, credentials, and internal targets with synthetic values.
          required: true
